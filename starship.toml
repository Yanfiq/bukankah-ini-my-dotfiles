palette = "noctalia"
add_newline = true

# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
[╭──](bold cyan)$python[\\(](bold cyan)[$username@$hostname](bold blue)[\\)](bold cyan)[─](bold cyan)[\\[](bold cyan)[$directory](bold blue)[\\]](bold cyan) [$git_branch](bold blue)
[╰─](bold cyan)$character
"""

[character]
success_symbol = "[\\$](blue bold)"
error_symbol = "[\\$](red bold)"

[username]
style_user = 'blue bold'
style_root = 'red bold'
format = '[$user]($style)'
disabled = false
show_always = true

[directory]
home_symbol = "~"
read_only = ""
style = "blue"
truncation_length = 2
truncation_symbol = "••/"
format = '[󰉋 $path]($style)'

# [directory.substitutions]
# "Desktop" = ""
# "Documents" = ""
# "Downloads" = ""
# "Music" = "󰎈"
# "Pictures" = ""
# "Videos" = ""
# "GitHub" = "󰊤"

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue)[$hostname](bold blue)'
disabled = false

[git_branch]
format = "[$symbol$branch(:$remote_branch)](bold blue)"
[git_status]
format = '([$all_status$ahead_behind](bold blue))'

[python]
# This is the default format, which includes the virtualenv name
# format = '([\\(](bold cyan)[](blue) [$pyenv_prefix$version$virtualenv](bold cyan)[\\)](bold cyan))'
format = """([\\(](bold cyan)[$symbol](blue) [$virtualenv](blue)[\\)](bold cyan))"""
# format = '[($symbol$version)(\\($virtualenv\\)) ](bold cyan)'
symbol = ''



