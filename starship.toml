palette = "noctalia"
add_newline = true

# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗
# Cool stuff 󰜥   

format = """
[╭──](bold sapphire)$python[\\(](bold sapphire)[$username@$hostname](bold blue)[\\)](bold sapphire)[─](bold sapphire)[\\[](bold sapphire)[$directory](bold blue)[\\]](bold sapphire) [$git_branch](bold blue)
[╰─](bold sapphire)$character
"""

[character]
success_symbol = "[\\$](blue bold)"
error_symbol = "[\\$](red bold)"

[username]
style_user = 'blue bold'
style_root = 'red bold'
format = '[$user]($style)'
disabled = false
show_always = true

[directory]
home_symbol = "~"
read_only = ""
style = "blue"
truncation_length = 2
truncation_symbol = "••/"
format = '[󰉋 $path]($style)'

[hostname]
ssh_only = false
format = '[$ssh_symbol](bold blue)[$hostname](bold blue)'
disabled = false

[git_branch]
format = "[$symbol$branch(:$remote_branch)](bold blue)"
[git_status]
format = '([$all_status$ahead_behind](bold blue))'

[python]
# This is the default format, which includes the virtualenv name
# format = '([\\(](bold sapphire)[](blue) [$pyenv_prefix$version$virtualenv](bold sapphire)[\\)](bold sapphire))'
format = """([\\(](bold sapphire)[$symbol](blue) [$virtualenv](blue)[\\)](bold sapphire))"""
# format = '[($symbol$version)(\\($virtualenv\\)) ](bold sapphire)'
symbol = ''

